<style>

us:20px;padding:5px 9px;font-size:10px;background:#edf8f1;color:var(--green);white-space:nowrap}.pill.warn{background:#fff4df;color:var(--amber)}.pill.bad{background:#fff0f0;color:var(--red)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:7px;min-width:0}.field label{font-size:12px;color:#52655c}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dbe6df;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 3px #16845b18}.search{max-width:360px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{text-align:right;padding:13px 14px;border-bottom:1px solid #edf2ef;font-size:12px;white-space:nowrap}th{background:#f8fbf9;color:#65766d;font-weight:bold}tbody tr:hover{background:#fbfdfb}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:30px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.form-grid .wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:15px}.notice{padding:12px 14px;border-radius:10px;background:#f0f8f3;color:#2c7050;font-size:12px;line-height:1.7;margin-bottom:15px}.hidden{display:none!important}.sale-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:16px}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.product-tile{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:right;background:#fff}.product-tile:hover{border-color:var(--green);background:#fbfffc}.product-tile strong{display:block;font-size:13px;margin-bottom:7px}.product-tile span{font-size:11px;color:var(--muted)}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #edf2ef;padding:12px 0;font-size:12px}.qty-controls{display:flex;align-items:center;gap:8px}.qty-controls button{border:1px solid var(--line);background:white;border-radius:6px;width:25px;height:25px}.total-row{display:flex;justify-content:space-between;padding:10px 0;font-size:13px}.total-row.final{font-size:20px;font-weight:bold;color:var(--green);border-top:1px solid var(--line);margin-top:5px;padding-top:16px}.toast{position:fixed;bottom:20px;left:20px;z-index:99;background:#173d2e;color:#fff;border-radius:12px;padding:13px 18px;box-shadow:var(--shadow);max-width:90vw;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#10251d77;z-index:80;display:grid;place-items:center;padding:15px}.modal{background:white;border-radius:18px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.close{border:0;background:#f1f5f2;border-radius:9px;width:34px;height:34px}.footer-note{font-size:11px;color:var(--muted);line-height:1.8;margin-top:16px}.mobile-menu{display:none}.settings-section{margin-bottom:18px}.settings-section h4{margin:0 0 14px;font-size:14px}.check-row{display:flex;align-items:center;gap:9px;font-size:12px}.check-row input{accent-color:var(--green)}.sync-box{display:flex;gap:12px;align-items:flex-start;padding:14px;background:#f8fbf9;border-radius:12px;font-size:12px;line-height:1.8}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.three-col{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.app{display:block}.sidebar{position:relative;right:auto;top:auto;width:100%;padding:10px 12px;gap:8px;display:block;box-shadow:none}.brand{padding:2px 4px 10px}.nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:4px;scrollbar-width:thin}.nav button{flex:0 0 auto;padding:9px 11px}.mobile-menu{display:none}.topbar{height:68px;padding:0 14px}.topbar h2{font-size:15px}.status{padding:8px;font-size:10px}.content{padding:16px 12px}.stats{gap:10px}.card{padding:14px;border-radius:13px}.stat-value{font-size:21px}.stat-icon{width:31px;height:31px}.page-head h3{font-size:19px}.sale-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}.three-col{grid-template-columns:1fr}.product-grid{grid-template-columns:1fr 1fr}.search{max-width:none;flex:1}.hide-mobile{display:none}.page-head{align-items:flex-start}.actions{width:100%}.actions .btn{flex:1}.two-col .card{min-width:0}}

<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">ح</div><div><h1 id="brandName">حاكم</h1><p>نظام إدارة الصيدلية</p></div></div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>لوحة التحكم</button><button data-page="sales"><span class="ico">🛒</span>المبيعات</button><button data-page="inventory"><span class="ico">▤</span>الأدوية والمخزون</button><button data-page="purchases"><span class="ico">📦</span>المشتريات</button><button data-page="suppliers"><span class="ico">🏭</span>الموردون</button><button data-page="customers"><span class="ico">👥</span>العملاء والديون</button><button data-page="expenses"><span class="ico">↗</span>المصروفات</button><button data-page="returns"><span class="ico">↩</span>المرتجعات</button><button data-page="stocktake"><span class="ico">☷</span>الجرد والتالف</button><button data-page="reports"><span class="ico">▥</span>التقارير</button><button data-page="alerts"><span class="ico">♧</span>التنبيهات</button><button data-page="closing"><span class="ico">✓</span>إغلاق يوم العمل</button><button data-page="settings"><span class="ico">⚙</span>الإعدادات</button>
</nav><div class="side-foot"><b>حالة البيانات</b><br>حفظ محلي على هذا الجهاز<br><span id="lastSaved">لم تُحفظ تغييرات بعد</span></div></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" onclick="toggleMenu()">☰</button><div><h2 id="pageTitle">لوحة التحكم</h2><div class="sub" id="todayLabel"></div></div></div><div class="status"><span class="dot"></span><span id="connectionLabel">وضع تجريبي محلي</span></div></header><div class="content" id="content"></div></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const today=()=>new Date().toISOString().slice(0,10);const fmt=n=>Number(n||0).toLocaleString('ar',{maximumFractionDigits:2});const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={settings:{name:'حاكم',address:'',phone:'',license:'',taxNumber:'',showTax:false,lowStock:10,expiryDays:90,managerEmail:'',pharmacistDiscount:5,usdToSdg:1,expiryAlerts:[90,60,30,7],cashVarianceAlertCount:3},drugs:[{id:id(),name:'باراسيتامول 500 مجم',generic:'Paracetamol',barcode:'100000001',strength:'500 مجم',form:'أقراص',manufacturer:'',price:1500,cost:900,stock:80,min:15,batch:'B-1001',expiry:'2027-10-01',controlled:false},{id:id(),name:'فيتامين C',generic:'Vitamin C',barcode:'100000002',strength:'1000 مجم',form:'أقراص فوارة',manufacturer:'',price:2800,cost:1800,stock:35,min:10,batch:'C-220',expiry:'2027-06-30',controlled:false},{id:id(),name:'محلول ملحي',generic:'Saline',barcode:'100000003',strength:'0.9%',form:'محلول',manufacturer:'',price:1200,cost:700,stock:8,min:12,batch:'S-012',expiry:'2028-01-15',controlled:false},{id:id(),name:'شراب للسعال',generic:'Cough syrup',barcode:'100000004',strength:'100 مل',form:'شراب',manufacturer:'',price:3500,cost:2200,stock:20,min:8,batch:'K-050',expiry:'2026-12-01',controlled:false}],sales:[],purchases:[],suppliers:[],customers:[],expenses:[],returns:[],adjustments:[],audit:[],cart:[],user:{name:'المدير',role:'manager'}};
let db;try{db=JSON.parse(localStorage.getItem('pharmacyDB')||'null')||seed}catch(e){db=seed}['drugs','sales','purchases','suppliers','customers','expenses','returns','adjustments','audit','cart'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.settings={...seed.settings,...(db.settings||{})};if(!db.settings.name||db.settings.name==='صيدليتي'||db.settings.name==='Elgody'||db.settings.name==='الجودي')db.settings.name='حاكم';db.user={...seed.user,...(db.user||{})};db.closings=db.closings||[];db.preferences=db.preferences||{};let currentPage='dashboard',searchText='',range='month';
function save(){
 const payload=JSON.stringify(db);
 try{
  const previous=localStorage.getItem('pharmacyDB');
  if(previous){try{JSON.parse(previous);localStorage.setItem('pharmacyDB_backup',previous);localStorage.setItem('pharmacyDB_backup_date',new Date().toISOString())}catch(e){}}
  localStorage.setItem('pharmacyDB',payload);
  const check=localStorage.getItem('pharmacyDB');
  if(check!==payload)throw new Error('storage verification failed');
  const ls=$('#lastSaved');if(ls)ls.textContent='آخر حفظ: '+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
  const state=$('#storageHealth');if(state)state.textContent='الحفظ المحلي يعمل';
 }catch(e){
  const ls=$('#lastSaved');if(ls)ls.textContent='تعذّر الحفظ — صدّر نسخة احتياطية فورًا';
  const state=$('#storageHealth');if(state)state.textContent='مشكلة في مساحة التخزين';
  console.error('Local storage save failed',e);
  if(typeof toast==='function')toast('تعذّر حفظ البيانات محليًا. نزّل نسخة احتياطية فورًا.');
 }
}
function testStorage(){try{const key='pharmacyDB_test_'+Date.now();localStorage.setItem(key,'ok');const ok=localStorage.getItem(key)==='ok';localStorage.removeItem(key);const data=localStorage.getItem('pharmacyDB');if(data)JSON.parse(data);toast(ok?'نجح اختبار التخزين وقراءة البيانات':'فشل اختبار التخزين');const state=$('#storageHealth');if(state)state.textContent=ok?'الحفظ المحلي يعمل':'فشل الاختبار';}catch(e){toast('فشل اختبار التخزين: قد تكون المساحة ممتلئة أو التخزين محظورًا');const state=$('#storageHealth');if(state)state.textContent='فشل الاختبار';}}
function restoreLocalBackup(){try{const raw=localStorage.getItem('pharmacyDB_backup');if(!raw) {toast('لا توجد نسخة محلية سابقة');return}const v=JSON.parse(raw);if(!Array.isArray(v.drugs)||!Array.isArray(v.sales)||!v.settings)throw Error('bad');if(!confirm('ستُستبدل البيانات الحالية بآخر نسخة محلية محفوظة قبل تعديل سابق. نزّل نسخة من الحالة الحالية أولًا؟'))return;download('pharmacy-before-local-restore-'+today()+'.json',JSON.stringify(db,null,2),'application/json');db=v;['drugs','sales','purchases','suppliers','customers','expenses','returns','adjustments','audit','cart','closings'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.settings={...seed.settings,...(db.settings||{})};save();log('استعادة النسخة المحلية السابقة','استعادة من pharmacyDB_backup');$('#brandName').textContent=db.settings.name||'حاكم';go('dashboard');toast('تمت استعادة النسخة المحلية السابقة')}catch(e){toast('تعذر استعادة النسخة المحلية؛ الملف غير صالح')}}
function previewChanges(title,oldObj,newObj,keys){const changes=keys.filter(k=>String(oldObj?.[k]??'')!==String(newObj?.[k]??'')).map(k=>({k,old:oldObj?.[k]??'—',now:newObj?.[k]??'—'}));if(!changes.length)return true;return confirm(title+'\n\n'+changes.map(x=>x.k+': '+x.old+' ←→ '+x.now).join('\n')+'\n\nهل تؤكد حفظ هذه التغييرات؟')}
function safeRestoreSnapshot(){download('pharmacy-before-restore-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function log(action,detail=''){db.audit.unshift({id:id(),date:new Date().toISOString(),user:db.user?.name||'المدير',action,detail});db.audit=db.audit.slice(0,500);save()}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2800)}
function toggleMenu(){$('#sidebar').classList.toggle('open')}
const pageNames={dashboard:'لوحة التحكم',sales:'المبيعات',inventory:'الأدوية والمخزون',purchases:'المشتريات',suppliers:'الموردون',customers:'العملاء والديون',expenses:'المصروفات',returns:'المرتجعات',stocktake:'الجرد والتالف',reports:'التقارير',alerts:'التنبيهات',closing:'إغلاق يوم العمل',settings:'الإعدادات'};
function go(page){currentPage=page;searchText='';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').textContent=pageNames[page]||page;$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#todayLabel').textContent=new Date().toLocaleDateString('ar',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
function head(title,desc,buttons=''){return `<div class="page-head"><div><h3>${title}</h3><p>${desc||''}</p></div><div class="actions">${buttons}</div></div>`}
function stat(label,value,icon,note=''){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td class="empty" colspan="${headers.length}">لا توجد بيانات بعد</td></tr>`}</tbody></table></div>`}
function row(cells){return `<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`}
function searchBox(ph='ابحث بالاسم أو الباركود...'){return `<input class="search" id="searchInput" placeholder="${ph}" value="${escapeHtml(searchText)}" oninput="searchText=this.value;renderBodyOnly()">`}
function render(){const c=$('#content');c.innerHTML=renderPage();}
function renderBodyOnly(){render()}
function renderPage(){switch(currentPage){case'dashboard':return dashboard();case'sales':return salesPage();case'inventory':return inventoryPage();case'purchases':return purchasesPage();case'suppliers':return suppliersPage();case'customers':return customersPage();case'expenses':return expensesPage();case'returns':return returnsPage();case'stocktake':return stocktakePage();case'reports':return reportsPage();case'alerts':return alertsPage();case'closing':return closingPage();case'settings':return settingsPage();default:return dashboard()}}
function dashboard(){let day=today(),sales=db.sales.filter(x=>x.date===day),rev=sales.reduce((a,x)=>a+x.total,0),profit=sales.reduce((a,x)=>a+x.profit,0),stock=db.drugs.reduce((a,x)=>a+x.stock,0),low=db.drugs.filter(x=>x.stock<=Number(x.min||db.settings.lowStock)),near=db.drugs.filter(x=>x.expiry&&x.expiry<=new Date(Date.now()+Number(db.settings.expiryDays)*86400000).toISOString().slice(0,10));let max=1;let last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let k=d.toISOString().slice(0,10);return {k,label:d.toLocaleDateString('ar',{weekday:'short'}),val:db.sales.filter(s=>s.date===k).reduce((a,s)=>a+s.total,0)}});max=Math.max(...last7.map(x=>x.val),1);return `${head('أهلًا بك في '+(db.settings.name||'حاكم'),'نظرة سريعة على نشاط الصيدلية اليوم',`<button class="btn primary" onclick="go('sales')">＋ فاتورة بيع جديدة</button><button class="btn" onclick="go('inventory')">＋ إضافة دواء</button>`)}<div class="grid stats">${stat('مبيعات اليوم',fmt(rev),'↗',sales.length+' فاتورة')}${stat('الربح الإجمالي اليوم',fmt(profit),'◈','بعد تكلفة الأدوية والخصومات')}${stat('أصناف المخزون',fmt(db.drugs.length),'▤',fmt(stock)+' وحدة بالمخزون')}${stat('تنبيهات المخزون',fmt(low.length+near.length),'♧',low.length+' منخفضة · '+near.length+' قريبة الانتهاء')}</div><div class="grid two-col"><div class="card"><h4 class="section-title">المبيعات خلال 7 أيام <small>حسب تاريخ الفاتورة</small></h4><div class="bar-chart">${last7.map(x=>`<div class="bar-wrap"><b>${x.val?fmt(x.val):'—'}</b><div class="bar" style="height:${Math.max(3,x.val/max*75)}%"></div><span>${x.label}</span></div>`).join('')}</div></div><div class="card"><h4 class="section-title">تحتاج إلى متابعة <small>مخزون وتنبيهات</small></h4><div class="list">${low.slice(0,4).map(d=>`<div class="list-row"><span>${escapeHtml(d.name)}<br><small style="color:var(--muted)">المتوفر: ${fmt(d.stock)}</small></span><span class="pill warn">مخزون منخفض</span></div>`).join('')}${near.slice(0,3).map(d=>`<div class="list-row"><span>${escapeHtml(d.name)}<br><small style="color:var(--muted)">الانتهاء: ${escapeHtml(d.expiry)}</small></span><span class="pill bad">قرب الانتهاء</span></div>`).join('')}${!low.length&&!near.length?'<div class="empty">لا توجد تنبيهات عاجلة حاليًا</div>':''}</div></div></div><div class="grid two-col" style="margin-top:16px"><div class="card"><h4 class="section-title">آخر المبيعات</h4>${table(['رقم الفاتورة','التاريخ','الإجمالي','الطريقة'],db.sales.slice(0,5).map(s=>row([escapeHtml(s.no),escapeHtml(s.date),fmt(s.total),escapeHtml(s.method||'نقدي')])))}</div><div class="card"><h4 class="section-title">إجراءات سريعة</h4><div class="grid three-col"><button class="btn" onclick="go('sales')">🛒 تسجيل بيع</button><button class="btn" onclick="openDrugForm()">＋ إضافة دواء</button><button class="btn" onclick="go('purchases')">📦 تسجيل شراء</button><button class="btn" onclick="go('expenses')">＋ مصروف</button><button class="btn" onclick="go('stocktake')">☷ الجرد</button><button class="btn" onclick="go('reports')">▥ التقارير</button><button class="btn" onclick="go('closing')">✓ إغلاق اليوم</button></div><p class="footer-note">الأرقام تُحسب من البيانات المسجلة في هذا الجهاز. الربط المركزي والمزامنة السحابية يحتاجان إلى إعداد خادم وقاعدة بيانات.</p></div></div>`}
function inventoryPage(){let list=db.drugs.filter(d=>(d.name+' '+d.generic+' '+d.barcode+' '+d.strength).toLowerCase().includes(searchText.toLowerCase()));return `${head('الأدوية والمخزون','إدارة الأصناف والأسعار والكميات والدفعات',`<button class="btn" onclick="exportDrugs()">تصدير Excel/CSV</button><button class="btn" onclick="$('#importFile').click()">استيراد CSV</button><button class="btn primary" onclick="openDrugForm()">＋ إضافة دواء</button>`)}<div class="notice">تُحفظ تغييرات المخزون محليًا في هذا النموذج. تأكد من تسجيل رقم الدفعة وتاريخ الانتهاء عند إدخال المخزون الفعلي.</div><div class="toolbar">${searchBox()}<select class="search" style="max-width:210px" onchange="filterStock=this.value;render()"><option value="all">كل الأصناف</option><option value="low">مخزون منخفض</option><option value="expiry">قريبة الانتهاء</option></select><input id="importFile" type="file" accept=".csv,text/csv" class="hidden" onchange="importDrugs(this.files[0])"></div>${table(['الدواء','الباركود','الشكل/التركيز','سعر البيع','التكلفة','المتوفر','الحد الأدنى','الدفعة / الانتهاء','الإجراءات'],list.filter(d=>{let f=$('select.search')?.value||'all';return f==='low'?d.stock<=Number(d.min||db.settings.lowStock):f==='expiry'?d.expiry&&d.expiry<=new Date(Date.now()+Number(db.settings.expiryDays)*86400000).toISOString().slice(0,10):true}).map(d=>row([`<b>${escapeHtml(d.name)}</b>${d.controlled?' <span class="pill bad">مقيّد</span>':''}`,escapeHtml(d.barcode||'—'),escapeHtml((d.form||'')+' '+(d.strength||'')),fmt(d.price),fmt(d.cost),`<span class="${d.stock<=Number(d.min||db.settings.lowStock)?'pill warn':''}">${fmt(d.stock)}</span>`,fmt(d.min),escapeHtml((d.batch||'—')+' / '+(d.expiry||'—')),`<button class="btn" onclick="openDrugForm('${d.id}')">تعديل</button> <button class="btn danger" onclick="deleteDrug('${d.id}')">حذف</button>`])))}`}
let filterStock='all';
function openDrugForm(drugId){let d=db.drugs.find(x=>x.id===drugId)||{id:'',name:'',generic:'',barcode:'',strength:'',form:'',manufacturer:'',price:'',cost:'',stock:'',min:db.settings.lowStock,batch:'',expiry:'',controlled:false};modal(` <div class="modal-head"><h3>${drugId?'تعديل دواء':'إضافة دواء جديد'}</h3><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveDrug(event,'${d.id}')"><div class="form-grid">${field('اسم الدواء','name',d.name,true)}${field('الاسم العلمي','generic',d.generic)}${field('الباركود','barcode',d.barcode)}${field('التركيز','strength',d.strength)}${field('الشكل الدوائي','form',d.form)}${field('الشركة المصنعة','manufacturer',d.manufacturer)}${field('سعر البيع','price',d.price,true,'number')}${field('تكلفة الشراء','cost',d.cost,true,'number')}${field('الكمية المتوفرة','stock',d.stock,true,'number')}${field('حد إعادة الطلب','min',d.min,false,'number')}${field('رقم الدفعة','batch',d.batch)}${field('تاريخ الانتهاء','expiry',d.expiry,false,'date')}<div class="field"><label>التصنيف</label><label class="check-row"><input type="checkbox" name="controlled" ${d.controlled?'checked':''}> دواء مقيّد — تنبيه عند البيع</label></div></div><div class="form-actions"><button class="btn primary">حفظ الدواء</button><button type="button" class="btn" onclick="closeModal()">إلغاء</button></div></form>`)}
function field(label,name,value,required=false,type='text'){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${escapeHtml(value)}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function saveDrug(e,drugId){e.preventDefault();let f=new FormData(e.target),old=db.drugs.find(d=>d.id===drugId);let d={id:drugId||id(),name:f.get('name').trim(),generic:f.get('generic')||'',barcode:f.get('barcode')||'',strength:f.get('strength')||'',form:f.get('form')||'',manufacturer:f.get('manufacturer')||'',price:Number(f.get('price')||0),cost:Number(f.get('cost')||0),stock:Number(f.get('stock')||0),min:Number(f.get('min')||0),batch:f.get('batch')||'',expiry:f.get('expiry')||'',controlled:f.has('controlled')};if(d.barcode&&db.drugs.some(x=>x.barcode===d.barcode&&x.id!==drugId)){toast('هذا الباركود مستخدم لدواء آخر');return}if(old&&!previewChanges('مراجعة التعديل — '+d.name,old,d,['name','generic','barcode','strength','form','manufacturer','price','cost','stock','min','batch','expiry']))return;if(old)Object.assign(old,d);else db.drugs.unshift(d);log(old?'تعديل دواء':'إضافة دواء',d.name);closeModal();render();toast('تم حفظ بيانات الدواء')}
function deleteDrug(id0){let d=db.drugs.find(x=>x.id===id0);if(!d)return;if(!confirm('هل تريد حذف الصنف؟ يُفضّل عدم الحذف إذا كان مرتبطًا بفواتير.'))return;db.drugs=db.drugs.filter(x=>x.id!==id0);log('حذف دواء',d.name);render();toast('تم حذف الصنف')}
function salesPage(){let list=db.drugs.filter(d=>(d.name+' '+d.barcode+' '+d.generic).toLowerCase().includes(searchText.toLowerCase()));let cart=db.cart||[],total=cart.reduce((a,x)=>a+x.price*x.qty,0),discount=Number(window.saleDiscount||0),net=Math.max(0,total-discount);return `${head('نقطة البيع','ابحث بالاسم أو امسح الباركود ثم أضف الأصناف إلى الفاتورة',`<button class="btn" onclick="clearCart()">تفريغ الفاتورة</button>`)}<div class="sale-layout"><div class="card"><div class="toolbar">${searchBox('اسم الدواء أو الباركود')}<button class="btn" onclick="scanPrompt()">⌕ إدخال باركود</button></div><div class="product-grid">${list.slice(0,20).map(d=>`<button class="product-tile" onclick="addCart('${d.id}')"><strong>${escapeHtml(d.name)}</strong><span>${escapeHtml((d.strength||'')+' · '+(d.form||''))}</span><div style="display:flex;justify-content:space-between;margin-top:12px"><b>${fmt(d.price)}</b><span>المتوفر ${fmt(d.stock)}</span></div>${d.controlled?'<div style="margin-top:8px"><span class="pill warn">دواء مقيّد</span></div>':''}</button>`).join('')||'<div class="empty">لا توجد أصناف مطابقة</div>'}</div></div><div class="card"><h4 class="section-title">الفاتورة الحالية <small>${cart.length} صنف</small></h4><div>${cart.map(x=>`<div class="cart-line"><div><b>${escapeHtml(x.name)}</b><div style="color:var(--muted);margin-top:5px">${fmt(x.price)} للوحدة</div><div class="qty-controls" style="margin-top:8px"><button onclick="changeQty('${x.drugId}',-1)">−</button><span>${x.qty}</span><button onclick="changeQty('${x.drugId}',1)">＋</button><button class="btn danger" style="width:auto;padding:2px 7px" onclick="removeCart('${x.drugId}')">حذف</button></div></div><b>${fmt(x.price*x.qty)}</b></div>`).join('')||'<div class="empty">أضف دواء لبدء الفاتورة</div>'}</div><div class="field" style="margin-top:14px"><label>خصم من الإجمالي (مبلغ)</label><input type="number" min="0" max="'+total+'" value="'+discount+'" oninput="saleDiscount=Number(this.value);render()"></div><div class="field" style="margin-top:12px"><label>طريقة الدفع</label><select id="saleMethod"><option>كاش</option><option>تحويل بنكي</option><option>آجل</option></select></div><div class="field" style="margin-top:12px"><label>العميل (اختياري)</label><select id="saleCustomer"><option value="">بدون ربط عميل</option>${db.customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} — رصيد ${fmt(c.balance||0)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>اسم العميل (اختياري)</label><input id="saleCustomerName" placeholder="يمكن تركه فارغًا"></div><div class="field" style="margin-top:10px"><label>رقم العميل (اختياري)</label><input id="saleCustomerNumber" placeholder="يمكن تركه فارغًا" inputmode="numeric"></div><div class="total-row"><span>الإجمالي قبل الخصم</span><b>${fmt(total)}</b></div><div class="total-row"><span>الخصم</span><b>${fmt(discount)}</b></div><div class="total-row final"><span>المطلوب</span><span>${fmt(net)}</span></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="completeSale()" ${!cart.length?'disabled':''}>تأكيد البيع وطباعة الإيصال</button><p class="footer-note">هذه النسخة تحفظ البيانات محليًا. البيع الآجل والمزامنة المركزية يحتاجان إلى تهيئة الإنتاج قبل الاستخدام التجاري.</p></div></div>`}
let saleDiscount=0;function addCart(did){let d=db.drugs.find(x=>x.id===did);if(!d)return;if(d.expiry&&d.expiry<today()){toast('ممنوع بيع دفعة منتهية الصلاحية');return}let x=db.cart.find(x=>x.drugId===did);if((x?x.qty:0)>=d.stock){toast('الكمية المطلوبة تتجاوز المخزون');return}if(d.controlled&&!confirm('تنبيه: هذا الدواء مصنّف كمقيّد. هل تريد المتابعة؟'))return;if(x)x.qty++;else db.cart.push({drugId:d.id,name:d.name,price:d.price,qty:1,cost:d.cost});render()}
function changeQty(did,n){let x=db.cart.find(x=>x.drugId===did),d=db.drugs.find(x=>x.id===did);if(!x)return;if(n>0&&x.qty>=d.stock){toast('لا توجد كمية كافية');return}x.qty+=n;if(x.qty<=0)db.cart=db.cart.filter(y=>y.drugId!==did);render()}function removeCart(did){db.cart=db.cart.filter(x=>x.drugId!==did);render()}function clearCart(){db.cart=[];saleDiscount=0;render()}function scanPrompt(){let v=prompt('أدخل أو امسح الباركود');if(!v)return;let d=db.drugs.find(x=>x.barcode===v.trim());if(!d){toast('لم يتم العثور على الباركود');return}addCart(d.id)}
function completeSale(){let cart=db.cart||[];if(!cart.length)return;let gross=cart.reduce((a,x)=>a+x.price*x.qty,0),disc=Math.min(gross,Math.max(0,Number(saleDiscount||0))),total=gross-disc,method=$('#saleMethod')?.value||'كاش',customerId=$('#saleCustomer')?.value||'',customerName=$('#saleCustomerName')?.value?.trim()||'',customerNumber=$('#saleCustomerNumber')?.value?.trim()||'',fxRate=Number(db.settings.usdToSdg||1);if(disc>gross){toast('الخصم أكبر من الإجمالي');return}if(method==='آجل'&&!customerId){toast('اختر حساب عميل مسجل لتسجيل البيع الآجل');return}if(method==='آجل'){let c=db.customers.find(x=>x.id===customerId);if(c&&Number(c.balance||0)+total>Number(c.limit||0)){toast('تجاوز البيع حد ائتمان العميل');return}}for(let x of cart){let d=db.drugs.find(y=>y.id===x.drugId);if(!d||d.stock<x.qty){toast('تغير المخزون؛ راجع الكميات');return}}cart.forEach(x=>{let d=db.drugs.find(y=>y.id===x.drugId);d.stock-=x.qty});let s={id:id(),no:'S-'+Date.now().toString().slice(-8),date:today(),time:new Date().toLocaleTimeString('ar'),items:cart.map(x=>({...x})),gross,discount:disc,total,profit:cart.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0)-disc,method,customerId,customerName,customerNumber,exchangeRate:fxRate,currency:'SDG'};db.sales.unshift(s);if(method==='آجل'){let c=db.customers.find(x=>x.id===customerId);c.balance=Number(c.balance||0)+total}db.cart=[];saleDiscount=0;log('فاتورة بيع',s.no+' — '+fmt(total));render();toast('تم تسجيل الفاتورة '+s.no);if(confirm('تم حفظ الفاتورة. هل تريد فتح نافذة الطباعة؟'))printReceipt(s)}
function printReceipt(s){let st=db.settings,w=window.open('','_blank','width=420,height=650');if(!w){toast('اسمح بفتح نافذة الطباعة من المتصفح');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="UTF-8"><title>إيصال ${s.no}</title><style>body{font:14px Tahoma,Arial;padding:16px;width:300px;margin:auto}h2,p{text-align:center}table{width:100%;border-collapse:collapse}td,th{padding:7px 2px;border-bottom:1px dashed #aaa;text-align:right;font-size:12px}.tot{font-weight:bold;font-size:17px}</style><h2>${escapeHtml(st.name||'الصيدلية')}</h2><p>${escapeHtml(st.address||'')}<br>${escapeHtml(st.phone||'')}</p><hr><p>فاتورة: ${escapeHtml(s.no)}<br>${escapeHtml(s.date)} ${escapeHtml(s.time||'')}</p><table><tr><th>الصنف</th><th>ك</th><th>الإجمالي</th></tr>${s.items.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.qty}</td><td>${fmt(x.price*x.qty)}</td></tr>`).join('')}</table><p>قبل الخصم: ${fmt(s.gross)}<br>الخصم: ${fmt(s.discount)}</p><p class="tot">الإجمالي: ${fmt(s.total)}</p><p>طريقة الدفع: ${escapeHtml(s.method)}</p>${s.customerName?`<p>العميل: ${escapeHtml(s.customerName)}</p>`:''}${s.customerNumber?`<p>رقم العميل: ${escapeHtml(s.customerNumber)}</p>`:''}<p style="color:#18713a;font-weight:bold;line-height:1.8">شكرًا لثقتكم بنا 💚<br>نسعد بخدمتكم، ونتمنى أن تنال خدماتنا رضاكم دائمًا.<br>صحتكم تهمّنا، ورضاكم غايتنا.<br>نتطلع إلى خدمتكم مجددًا — حاكم لإدارة الصيدلية</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function purchasesPage(){return `${head('المشتريات','تسجيل استلام فاتورة المورد وتحديث دفعات المخزون',`<button class="btn" onclick="exportData('purchases')">تصدير</button><button class="btn primary" onclick="openPurchaseForm()">＋ تسجيل شراء</button>`)}<div class="notice">تحديث المخزون يتم عند تسجيل الاستلام هنا. أدخل التكلفة والدفعة والانتهاء؛ النظام يحفظ العملة الأصلية وسعر الصرف عند توفرهما في بيانات الشراء.</div>${table(['رقم الشراء','التاريخ','المورد','الإجمالي','المدفوع','المتبقي','الحالة'],db.purchases.map(p=>row([escapeHtml(p.no),escapeHtml(p.date),escapeHtml(p.supplierName||'—'),fmt(p.total),fmt(p.paid),fmt(p.total-p.paid),p.paid>=p.total?'<span class="pill">مسدد</span>':'<span class="pill warn">متبقي</span>'])))}`}
function openPurchaseForm(){if(!db.drugs.length){toast('أضف دواء أولًا');return}modal(`<div class="modal-head"><h3>تسجيل فاتورة شراء واستلام</h3><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="savePurchase(event)"><div class="form-grid">${field('اسم المورد','supplierName','',true)}${field('رقم الفاتورة','supplierInvoice','')}${field('التاريخ','date',today(),true,'date')}<div class="field"><label>الدواء *</label><select name="drugId" required>${db.drugs.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}</select></div>${field('الكمية المستلمة','qty','1',true,'number')}${field('تكلفة الوحدة','cost','0',true,'number')}${field('رقم الدفعة','batch','')}${field('تاريخ الانتهاء','expiry','',false,'date')}${field('المدفوع','paid','0',false,'number')}${field('العملة الأصلية','currency','SDG')}${field('سعر الصرف إلى SDG','rate','1',false,'number')}</div><div class="form-actions"><button class="btn primary">حفظ واستلام المخزون</button></div></form>`)}
function savePurchase(e){e.preventDefault();let f=new FormData(e.target),d=db.drugs.find(x=>x.id===f.get('drugId')),qty=Number(f.get('qty')),cost=Number(f.get('cost')),rate=Number(f.get('rate')||1);if(!d||qty<=0||cost<0||rate<=0){toast('تحقق من الكمية والتكلفة وسعر الصرف');return}let total=qty*cost*rate,paid=Number(f.get('paid')||0);let existingSupplier=db.suppliers.find(x=>x.name===f.get('supplierName'));let p={id:id(),no:'P-'+Date.now().toString().slice(-8),date:f.get('date'),supplierName:f.get('supplierName'),supplierId:existingSupplier?.id||'',supplierInvoice:f.get('supplierInvoice'),drugId:d.id,drugName:d.name,qty,cost,currency:f.get('currency')||'SDG',rate,total,paid,batch:f.get('batch')||'',expiry:f.get('expiry')||''};d.stock+=qty;d.cost=cost*rate;if(p.batch)d.batch=p.batch;if(p.expiry)d.expiry=p.expiry;db.purchases.unshift(p);let supplier=db.suppliers.find(x=>x.name===p.supplierName);if(!supplier){supplier={id:id(),name:p.supplierName,phone:'',balance:0};db.suppliers.unshift(supplier)}p.supplierId=supplier.id;supplier.balance=Number(supplier.balance||0)+total-paid;log('فاتورة شراء',p.no);save();closeModal();render();toast('تم تسجيل الشراء وتحديث المخزون')}
function suppliersPage(){let ranked=db.suppliers.map(s=>{let ps=db.purchases.filter(p=>p.supplierId===s.id||p.supplierName===s.name),late=ps.filter(p=>p.lateDelivery).length,qty=ps.reduce((a,p)=>a+Number(p.qty||0),0),score=Math.max(0,Math.min(100,100-(ps.length?Math.round(late/ps.length*30):0)-(Number(s.returnsRate||0)*2)));return {...s,ps,score,qty}});let priceAlerts=[];db.purchases.forEach(p=>{let old=db.purchases.filter(x=>x.drugId===p.drugId&&x.id!==p.id&&x.date<=p.date).sort((a,b)=>b.date.localeCompare(a.date))[0];if(old&&Number(old.cost)>0&&Number(p.cost)>Number(old.cost)*1.15)priceAlerts.push({drug:p.drugName,supplier:p.supplierName,old:old.cost,now:p.cost,date:p.date,change:Math.round((p.cost-old.cost)/old.cost*100)})});return `${head('الموردون','ملفات الموردين، مؤشرات الأداء، مقارنة الأسعار والتنبيهات',`<button class="btn" onclick="exportData('suppliers')">تصدير الموردين</button><button class="btn primary" onclick="openPartyForm('supplier')">＋ إضافة مورد</button>`)}<div class="grid stats">${stat('عدد الموردين',fmt(db.suppliers.length),'🏭','المسجلون')}${stat('المستحق للموردين',fmt(db.suppliers.reduce((a,s)=>a+Number(s.balance||0),0)),'◈','الأرصدة الحالية')}${stat('طلبات الشراء',fmt(db.purchases.length),'📦','سجل المشتريات')}${stat('تنبيهات ارتفاع السعر',fmt(priceAlerts.length),'↗','ارتفاع أكثر من 15% عن شراء سابق')}</div><div class="notice">تقييم الأداء هنا مؤشر أولي مبني على البيانات المسجلة فقط؛ لا يُعد حكمًا نهائيًا على المورد. أدخل بيانات التسليم والمرتجعات في ملف المورد لتحسين التقييم.</div><div class="card"><h4 class="section-title">ملفات الموردين ومؤشر الأداء</h4>${table(['المورد','الهاتف','التواصل/البريد','شروط الدفع','مدة التوريد','الرصيد','مؤشر مبدئي','الإجراءات'],ranked.map(s=>row([escapeHtml(s.name),escapeHtml(s.phone||'—'),escapeHtml(s.email||s.contact||'—'),escapeHtml(s.paymentTerms||'—'),escapeHtml(s.leadTime||'—'),fmt(s.balance||0),`<span class="pill ${s.score<70?'warn':''}">${s.score}/100</span>`,`<button class="btn" onclick="partyPayment('supplier','${s.id}')">تسجيل دفعة</button> <button class="btn" onclick="openPartyForm('supplier','${s.id}')">ملف/تعديل</button>`])))}</div><div class="card" style="margin-top:16px"><h4 class="section-title">تنبيهات تغير تكلفة الشراء</h4>${priceAlerts.length?table(['الصنف','المورد','التكلفة السابقة','التكلفة الحالية','التغير','التاريخ'],priceAlerts.map(a=>row([escapeHtml(a.drug),escapeHtml(a.supplier),fmt(a.old),fmt(a.now),`<span class="pill warn">+${a.change}%</span>`,escapeHtml(a.date)]))):'<div class="empty">لا توجد ارتفاعات تتجاوز 15% مقارنة بفاتورة شراء سابقة للصنف نفسه.</div>'}</div><div class="card" style="margin-top:16px"><h4 class="section-title">سجل مشتريات الموردين</h4>${table(['التاريخ','المورد','الفاتورة','الصنف','الكمية','تكلفة الوحدة','الإجمالي'],db.purchases.map(p=>row([escapeHtml(p.date),escapeHtml(p.supplierName||'—'),escapeHtml(p.supplierInvoice||p.no||'—'),escapeHtml(p.drugName||'—'),fmt(p.qty),fmt(p.cost),fmt(p.total)])))}</div>`}
function customersPage(){return `${head('العملاء والديون','حسابات العملاء والمبيعات الآجلة والتحصيلات',`<button class="btn primary" onclick="openPartyForm('customer')">＋ إضافة عميل</button>`)}${table(['العميل','الهاتف','حد الائتمان','الرصيد المستحق','الإجراءات'],db.customers.map(c=>row([escapeHtml(c.name),escapeHtml(c.phone||'—'),fmt(c.limit||0),fmt(c.balance||0),`<button class="btn" onclick="partyPayment('customer','${c.id}')">تحصيل دفعة</button> <button class="btn" onclick="openPartyForm('customer','${c.id}')">تعديل</button>`])))}`}
function openPartyForm(type,partyId){let arr=type==='supplier'?db.suppliers:db.customers,p=arr.find(x=>x.id===partyId)||{id:'',name:'',phone:'',balance:0,limit:0};modal(`<div class="modal-head"><h3>${type==='supplier'?'بيانات المورد':'بيانات العميل'}</h3><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveParty(event,'${type}','${p.id}')"><div class="form-grid">${field('الاسم','name',p.name,true)}${field('الهاتف','phone',p.phone)}${type==='customer'?field('حد الائتمان','limit',p.limit||0,false,'number'):`${field('البريد الإلكتروني','email',p.email||'')}${field('اسم مسؤول التواصل','contact',p.contact||'')}${field('العنوان','address',p.address||'')}${field('الرقم الضريبي/التعريفي','taxId',p.taxId||'')}${field('شروط الدفع','paymentTerms',p.paymentTerms||'')}${field('مدة التوريد بالأيام','leadTime',p.leadTime||'',false,'number')}${field('الحد الائتماني','creditLimit',p.creditLimit||0,false,'number')}${field('نسبة المرتجعات التقديرية','returnsRate',p.returnsRate||0,false,'number')}${field('ملاحظات التفاوض','negotiationNotes',p.negotiationNotes||'')}`}</div><div class="form-actions"><button class="btn primary">حفظ</button></div></form>`)}
function saveParty(e,type,pid){e.preventDefault();let f=new FormData(e.target),arr=type==='supplier'?db.suppliers:db.customers,p=arr.find(x=>x.id===pid);if(!p){p={id:id(),balance:0};arr.unshift(p)}p.name=f.get('name').trim();p.phone=f.get('phone')||'';if(type==='customer')p.limit=Number(f.get('limit')||0);else {for(let k of ['email','contact','address','taxId','paymentTerms','negotiationNotes'])p[k]=f.get(k)||'';for(let k of ['leadTime','creditLimit','returnsRate'])p[k]=Number(f.get(k)||0)}log(type==='supplier'?'بيانات مورد':'بيانات عميل',p.name);closeModal();render();toast('تم حفظ البيانات')}
function partyPayment(type,pid){let arr=type==='supplier'?db.suppliers:db.customers,p=arr.find(x=>x.id===pid);if(!p)return;modal(`<div class="modal-head"><h3>${type==='supplier'?'دفعة للمورد':'تحصيل من العميل'}</h3><button class="close" onclick="closeModal()">✕</button></div><p>${escapeHtml(p.name)} — الرصيد الحالي: <b>${fmt(p.balance||0)}</b></p><form onsubmit="savePartyPayment(event,'${type}','${pid}')"><div class="form-grid">${field('المبلغ','amount','',true,'number')}${field('التاريخ','date',today(),true,'date')}${field('ملاحظات','note','')}</div><div class="form-actions"><button class="btn primary">تأكيد الدفعة</button></div></form>`)}
function savePartyPayment(e,type,pid){e.preventDefault();let f=new FormData(e.target),amt=Number(f.get('amount'));if(amt<=0){toast('أدخل مبلغًا صحيحًا');return}let arr=type==='supplier'?db.suppliers:db.customers,p=arr.find(x=>x.id===pid);if(!p)return;if(type==='supplier')p.balance=Math.max(0,Number(p.balance||0)-amt);else p.balance=Math.max(0,Number(p.balance||0)-amt);db.adjustments.unshift({id:id(),date:f.get('date'),type:type==='supplier'?'سداد مورد':'تحصيل عميل',name:p.name,amount:amt,note:f.get('note')||''});log('دفعة حساب',p.name+' '+amt);closeModal();render();toast('تم تسجيل الدفعة')}
function expensesPage(){let total=db.expenses.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0);return `${head('المصروفات','تسجيل المصروفات التشغيلية ومرفقاتها',`<button class="btn primary" onclick="openExpenseForm()">＋ تسجيل مصروف</button>`)}<div class="grid stats">${stat('مصروفات اليوم',fmt(total),'↗','حسب التاريخ المسجل')}${stat('إجمالي المصروفات',fmt(db.expenses.reduce((a,x)=>a+x.amount,0)),'◈','جميع الفترات')}${stat('عدد السجلات',fmt(db.expenses.length),'▤','سجل مصروفات')}${stat('المرفقات','—','▧','إرفاق ملفات يحتاج واجهة تخزين آمنة')}</div>${table(['التاريخ','التصنيف','الوصف','المبلغ','العملة','المسجل'],db.expenses.map(x=>row([escapeHtml(x.date),escapeHtml(x.category),escapeHtml(x.note||'—'),fmt(x.amount),escapeHtml(x.currency||'SDG'),escapeHtml(x.user||'المدير')])))}`}
function openExpenseForm(){modal(`<div class="modal-head"><h3>تسجيل مصروف</h3><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveExpense(event)"><div class="form-grid">${field('التاريخ','date',today(),true,'date')}<div class="field"><label>التصنيف *</label><select name="category"><option>إيجار</option><option>كهرباء</option><option>نقل</option><option>رواتب</option><option>صيانة</option><option>أخرى</option></select></div>${field('المبلغ','amount','',true,'number')}<div class="field"><label>العملة</label><select name="currency"><option>SDG</option><option>USD</option></select></div><div class="field"><label>الوصف</label><input name="note"></div></div><div class="form-actions"><button class="btn primary">حفظ المصروف</button></div></form>`)}function saveExpense(e){e.preventDefault();let f=new FormData(e.target),x={id:id(),date:f.get('date'),category:f.get('category'),amount:Number(f.get('amount')),currency:f.get('currency'),note:f.get('note')||'',user:db.user.name};if(x.amount<=0){toast('أدخل مبلغًا صحيحًا');return}db.expenses.unshift(x);log('تسجيل مصروف',x.category+' '+x.amount);closeModal();render();toast('تم حفظ المصروف')}
function returnsPage(){return `${head('المرتجعات','ربط المرتجع بفاتورة بيع أصلية ومراجعة حالة الصنف',`<button class="btn primary" onclick="openReturnForm()">＋ تسجيل مرتجع</button>`)}<div class="notice">لا يُعاد الصنف للمخزون القابل للبيع إلا بعد التحقق من الصلاحية وسلامة التخزين. سجل المرتجع لا يمحو الفاتورة الأصلية.</div>${table(['رقم المرتجع','التاريخ','الفاتورة الأصلية','الدواء','الكمية','المبلغ','إعادة للمخزون'],db.returns.map(x=>row([escapeHtml(x.no),escapeHtml(x.date),escapeHtml(x.saleNo),escapeHtml(x.drugName),fmt(x.qty),fmt(x.amount),x.restock?'<span class="pill">نعم</span>':'<span class="pill warn">لا</span>'])))}`}
function openReturnForm(){if(!db.sales.length){toast('لا توجد فواتير بيع');return}modal(`<div class="modal-head"><h3>تسجيل مرتجع</h3><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveReturn(event)"><div class="form-grid"><div class="field"><label>الفاتورة الأصلية *</label><select name="saleId" required onchange="updateReturnDrugs(this.value)"><option value="">اختر الفاتورة</option>${db.sales.map(s=>`<option value="${s.id}">${escapeHtml(s.no)} — ${escapeHtml(s.date)} — ${fmt(s.total)}</option>`).join('')}</select></div><div class="field"><label>الصنف *</label><select name="drugId" id="returnDrug" required><option value="">اختر الفاتورة أولًا</option></select></div>${field('الكمية','qty','1',true,'number')}<div class="field"><label>سبب المرتجع</label><select name="reason"><option>خطأ في البيع</option><option>تالف</option><option>أخرى</option></select></div><div class="field"><label>حالة الصنف</label><select name="condition"><option value="good">سليم وصالح للبيع</option><option value="bad">تالف / غير صالح للبيع</option></select></div></div><div class="form-actions"><button class="btn primary">حفظ المرتجع</button></div></form>`)}
function updateReturnDrugs(sid){let s=db.sales.find(x=>x.id===sid),el=$('#returnDrug');if(el)el.innerHTML=(s?.items||[]).map(x=>`<option value="${x.drugId}">${escapeHtml(x.name)} (الكمية المباعة ${x.qty})</option>`).join('')}
function saveReturn(e){e.preventDefault();let f=new FormData(e.target),s=db.sales.find(x=>x.id===f.get('saleId')),item=s?.items.find(x=>x.drugId===f.get('drugId')),qty=Number(f.get('qty'));if(!s||!item||qty<=0||qty>item.qty){toast('تحقق من الفاتورة والكمية المرتجعة');return}let d=db.drugs.find(x=>x.id===item.drugId),restock=f.get('condition')==='good'&&(!d.expiry||d.expiry>=today()),r={id:id(),no:'R-'+Date.now().toString().slice(-8),date:today(),saleId:s.id,saleNo:s.no,drugId:d.id,drugName:d.name,qty,amount:item.price*qty,reason:f.get('reason'),restock};if(restock)d.stock+=qty;s.total=Math.max(0,s.total-r.amount);s.profit=Math.max(0,s.profit-(item.price-item.cost)*qty);db.returns.unshift(r);log('مرتجع بيع',r.no+' / '+r.saleNo);closeModal();render();toast('تم تسجيل المرتجع'+(restock?' وإعادة الكمية للمخزون':'؛ لم تتم إعادة الصنف للمخزون'))}
function stocktakePage(){return `${head('الجرد والتالف','مقارنة الكمية الفعلية بالنظام وتسجيل التالف والمنتهي',`<button class="btn primary" onclick="openStockForm('count')">☷ جرد كمية</button><button class="btn" onclick="openStockForm('waste')">＋ تسجيل تالف/منتهي</button>`)}<div class="grid stats">${stat('قيمة المخزون بالتكلفة',fmt(db.drugs.reduce((a,d)=>a+d.stock*d.cost,0)),'▤','حساب تقريبي من تكلفة الصنف')}${stat('عدد أصناف المخزون',fmt(db.drugs.length),'◈','')}${stat('تسويات مسجلة',fmt(db.adjustments.filter(x=>x.type==='جرد'||x.type==='تالف/منتهي').length),'☷','راجع السجل أدناه')}${stat('أصناف منخفضة',fmt(db.drugs.filter(d=>d.stock<=Number(d.min||db.settings.lowStock)).length),'♧','') }</div>${table(['التاريخ','نوع الحركة','الصنف/الاسم','الكمية','السبب','المستخدم'],db.adjustments.filter(x=>['جرد','تالف/منتهي'].includes(x.type)).map(x=>row([escapeHtml(x.date),escapeHtml(x.type),escapeHtml(x.name),fmt(x.qty),escapeHtml(x.note||'—'),escapeHtml(db.user.name)])))}`}
function openStockForm(type){modal(`<div class="modal-head"><h3>${type==='count'?'تسجيل نتيجة جرد':'تسجيل تالف أو منتهي الصلاحية'}</h3><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveStockAction(event,'${type}')"><div class="form-grid"><div class="field"><label>الدواء *</label><select name="drugId" required>${db.drugs.map(d=>`<option value="${d.id}">${escapeHtml(d.name)} — المتوفر ${d.stock}</option>`).join('')}</select></div>${field(type==='count'?'الكمية الفعلية':'الكمية التالفة','qty','',true,'number')}${field('السبب/الملاحظات','note','',true)}${field('التاريخ','date',today(),true,'date')}</div><div class="notice">سيتم تسجيل الحركة في سجل المراجعة. في الإنتاج، تتطلب التسويات المالية النهائية اعتماد المدير وصلاحيات خادمية.</div><div class="form-actions"><button class="btn primary">تأكيد التسجيل</button></div></form>`)}function saveStockAction(e,type){e.preventDefault();let f=new FormData(e.target),d=db.drugs.find(x=>x.id===f.get('drugId')),qty=Number(f.get('qty'));if(!d||qty<0){toast('تحقق من الكمية');return}let before=d.stock;if(type==='count'){d.stock=qty;db.adjustments.unshift({id:id(),date:f.get('date'),type:'جرد',name:d.name,qty:qty-before,note:f.get('note')+' (قبل '+before+'، بعد '+qty+')'})}else{if(qty>d.stock){toast('الكمية التالفة أكبر من المخزون');return}d.stock-=qty;db.adjustments.unshift({id:id(),date:f.get('date'),type:'تالف/منتهي',name:d.name,qty,note:f.get('note')})}log(type==='count'?'تسوية جرد':'تسجيل تالف',d.name);closeModal();render();toast('تم تسجيل الحركة')}
function reportsPage(){let sales=db.sales,rev=sales.reduce((a,x)=>a+x.total,0),gross=sales.reduce((a,x)=>a+x.profit,0),expenses=db.expenses.reduce((a,x)=>a+x.amount,0),costs=db.purchases.reduce((a,x)=>a+x.total,0),ret=db.returns.reduce((a,x)=>a+x.amount,0);return `${head('مركز التقارير','مؤشرات مالية ومخزون قابلة للطباعة والتصدير',`<button class="btn" onclick="exportReport()">تصدير CSV</button><button class="btn primary" onclick="window.print()">طباعة التقرير</button>`)}<div class="toolbar"><div class="field"><label>من تاريخ</label><input id="fromDate" type="date" value="${new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10)}"></div><div class="field"><label>إلى تاريخ</label><input id="toDate" type="date" value="${today()}"></div><button class="btn primary" style="align-self:end" onclick="render()">تطبيق الفترة</button></div><div class="grid stats">${stat('صافي المبيعات',fmt(rev-ret),'↗','بعد خصم المرتجعات المسجلة')}${stat('ربح الأصناف التقريبي',fmt(gross),'◈','يُراجع عند اعتماد المرتجعات والخصومات')}${stat('المصروفات المسجلة',fmt(expenses),'↘','قد تشمل عملات مختلفة')}${stat('قيمة المشتريات',fmt(costs),'📦','بحسب سعر الصرف المسجل')}</div><div class="grid two-col"><div class="card"><h4 class="section-title">ملخص المبيعات حسب اليوم</h4>${table(['التاريخ','عدد الفواتير','إجمالي المبيعات','الخصومات','المرتجعات'],aggregateSales().map(x=>row([x.date,fmt(x.count),fmt(x.total),fmt(x.discount),fmt(x.returns)])))}</div><div class="card"><h4 class="section-title">أكثر الأصناف مبيعًا</h4>${table(['الدواء','الكمية المباعة','إيراد المبيعات'],topDrugs().map(x=>row([escapeHtml(x.name),fmt(x.qty),fmt(x.total)])))}</div></div><div class="card" style="margin-top:16px"><h4 class="section-title">ملخص الالتزامات والأرصدة</h4>${table(['البند','القيمة'],[row(['ديون العملاء',fmt(db.customers.reduce((a,c)=>a+Number(c.balance||0),0))]),row(['مستحقات الموردين',fmt(db.suppliers.reduce((a,s)=>a+Number(s.balance||0),0))]),row(['قيمة المخزون بالتكلفة',fmt(db.drugs.reduce((a,d)=>a+d.stock*d.cost,0))]),row(['خسائر التالف/المنتهي',fmt(db.adjustments.filter(x=>x.type==='تالف/منتهي').reduce((a,x)=>{let d=db.drugs.find(y=>y.name===x.name);return a+x.qty*(d?.cost||0)},0))])])}</div><p class="footer-note">مهم: هذه تقارير أولية من البيانات المدخلة في هذا الجهاز، وليست بديلًا عن مراجعة محاسبية. تحويل USD يحتاج أسعار صرف موثقة لكل حركة، وتوحيد العملة في هذه النسخة لا يتم تلقائيًا.</p>`}
function aggregateSales(){let map={};db.sales.forEach(s=>{let x=map[s.date]||(map[s.date]={date:s.date,count:0,total:0,discount:0,returns:0});x.count++;x.total+=s.total;x.discount+=s.discount||0});db.returns.forEach(r=>{if(map[r.date])map[r.date].returns+=r.amount});return Object.values(map).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15)}function topDrugs(){let m={};db.sales.forEach(s=>s.items.forEach(x=>{let y=m[x.drugId]||(m[x.drugId]={name:x.name,qty:0,total:0});y.qty+=x.qty;y.total+=x.qty*x.price}));return Object.values(m).sort((a,b)=>b.qty-a.qty).slice(0,10)}
function alertsPage(){let alerts=[];db.drugs.forEach(d=>{if(d.stock<=Number(d.min||db.settings.lowStock))alerts.push({type:'مخزون منخفض',name:d.name,detail:'المتوفر '+d.stock,cls:'warn'});if(d.expiry&&d.expiry<=new Date(Date.now()+Number(db.settings.expiryDays)*86400000).toISOString().slice(0,10)){let days=Math.ceil((new Date(d.expiry+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);alerts.push({type:days<0?'منتهي الصلاحية':days<=7?'انتهاء خلال 7 أيام':days<=30?'انتهاء خلال 30 يومًا':days<=60?'انتهاء خلال 60 يومًا':'انتهاء خلال 90 يومًا',name:d.name,detail:'الانتهاء '+d.expiry+' · الكمية '+fmt(d.stock)+' · التكلفة المحتملة '+fmt(d.stock*d.cost),cls:'bad'})}});db.customers.filter(c=>c.balance>0).forEach(c=>alerts.push({type:'رصيد عميل مستحق',name:c.name,detail:fmt(c.balance),cls:'warn'}));db.suppliers.filter(c=>c.balance>0).forEach(c=>alerts.push({type:'مستحق للمورد',name:c.name,detail:fmt(c.balance),cls:'warn'}));return `${head('مركز التنبيهات','تنبيهات المخزون والصلاحية والأرصدة',`<button class="btn" onclick="go('settings')">ضبط الحدود</button>`)}<div class="grid stats">${stat('إجمالي التنبيهات',fmt(alerts.length),'♧','حسب البيانات الحالية')}${stat('مخزون منخفض',fmt(alerts.filter(x=>x.type==='مخزون منخفض').length),'▤','')}${stat('قرب الانتهاء',fmt(alerts.filter(x=>x.type==='قرب انتهاء الصلاحية').length),'⌛','')}${stat('أرصدة تحتاج متابعة',fmt(alerts.filter(x=>x.type.includes('رصيد')||x.type.includes('مستحق')).length),'◈','')}</div><div class="card"><div class="list">${alerts.map(a=>`<div class="list-row"><div><b>${escapeHtml(a.name)}</b><div style="font-size:11px;color:var(--muted);margin-top:5px">${escapeHtml(a.detail)}</div></div><span class="pill ${a.cls}">${escapeHtml(a.type)}</span></div>`).join('')||'<div class="empty">لا توجد تنبيهات حاليًا</div>'}</div></div>`}
function closingPage(){let day=today(),saved=db.closings.find(x=>x.date===day),tasks=[['cash','مراجعة النقدية الفعلية ومقارنتها بالرصيد المتوقع'],['sales','مراجعة فواتير اليوم والخصومات والمرتجعات'],['debts','مراجعة التحصيلات ومدفوعات الموردين'],['stock','مراجعة تنبيهات المخزون والصلاحية'],['sync','التأكد من حفظ البيانات وتنزيل نسخة احتياطية عند الحاجة'],['approvals','إكمال التسويات أو العمليات التي تنتظر اعتماد المدير']];let checked=saved?.checked||{};return `${head('إغلاق يوم العمل','قائمة مراجعة يومية محفوظة محليًا مع تقرير قابل للطباعة',`<button class="btn" onclick="window.print()">طباعة</button><button class="btn primary" onclick="saveClosing()">حفظ إغلاق اليوم</button>`)}<div class="grid stats">${stat('فواتير اليوم',fmt(db.sales.filter(x=>x.date===day).length),'▤','')}${stat('مبيعات اليوم',fmt(db.sales.filter(x=>x.date===day).reduce((a,x)=>a+Number(x.total||0),0)),'↗','')}${stat('مرتجعات اليوم',fmt(db.returns.filter(x=>x.date===day).reduce((a,x)=>a+Number(x.amount||0),0)),'↩','')}${stat('مصروفات اليوم',fmt(db.expenses.filter(x=>x.date===day).reduce((a,x)=>a+Number(x.amount||0),0)),'↘','قد تتضمن عملات مختلفة')}</div><div class="card"><h4 class="section-title">قائمة الإغلاق — ${day}</h4><div class="list">${tasks.map(([k,label])=>`<label class="list-row"><span>${label}</span><input type="checkbox" data-close-task="${k}" ${checked[k]?'checked':''} style="width:20px;height:20px"></label>`).join('')}</div><div class="field" style="margin-top:14px"><label>ملاحظات الإغلاق / سبب أي فرق نقدي</label><textarea id="closingNote" rows="3" placeholder="سجّل الملاحظات بوضوح">${escapeHtml(saved?.note||'')}</textarea></div><p class="footer-note">لا تُجرى تسوية تلقائية لإخفاء فرق النقدية. أي فرق يجب توثيقه ومراجعته واعتماده حسب الصلاحيات.</p>${saved?`<div class="notice">آخر حفظ: ${escapeHtml(new Date(saved.savedAt).toLocaleString('ar'))} — حالة الإغلاق: ${saved.status==='closed'?'تم الحفظ':'مسودة'}</div>`:''}</div><div class="card" style="margin-top:14px"><h4 class="section-title">آخر الحركات المالية اليوم</h4>${table(['النوع','الرقم/البيان','القيمة'],[...db.sales.filter(x=>x.date===day).map(x=>row(['بيع',escapeHtml(x.no),fmt(x.total)])),...db.returns.filter(x=>x.date===day).map(x=>row(['مرتجع',escapeHtml(x.no),fmt(x.amount)])),...db.expenses.filter(x=>x.date===day).map(x=>row(['مصروف',escapeHtml(x.category),fmt(x.amount)]))])}</div>`}
function saveClosing(){let checked={};$$('[data-close-task]').forEach(x=>checked[x.dataset.closeTask]=x.checked);let all=Object.values(checked).length&&Object.values(checked).every(Boolean),note=$('#closingNote')?.value||'',rec={date:today(),checked,note,status:all?'closed':'draft',savedAt:new Date().toISOString(),user:db.user?.name||'المدير'};let i=db.closings.findIndex(x=>x.date===today());if(i>=0)db.closings[i]=rec;else db.closings.unshift(rec);log('حفظ إغلاق يوم العمل',rec.status==='closed'?'اكتملت القائمة':'حفظ مسودة؛ توجد مهام غير مكتملة');render();toast(all?'تم حفظ إغلاق اليوم':'تم حفظ القائمة كمسودة؛ توجد مهام غير مكتملة')}
function systemHealth(){let bytes=0;try{bytes=new Blob([JSON.stringify(db)]).size}catch(e){}return {bytes,drugs:db.drugs.length,sales:db.sales.length,audit:db.audit.length,last:localStorage.getItem('pharmacyDB')?'متاح محليًا':'غير محفوظ بعد'}}
function settingsPage(){let s=db.settings;return `${head('الإعدادات','بيانات الصيدلية وإعدادات المخزون والتصدير',`<button class="btn" onclick="exportBackup()">تنزيل نسخة احتياطية</button><button class="btn" onclick="document.getElementById('restoreFile').click()">استعادة نسخة</button>`)}<div class="notice">إعدادات الصيدلية محفوظة محليًا في المتصفح. الاستضافة السحابية، النسخ التلقائي إلى Google Drive، البريد الإلكتروني وتعدد الأجهزة تحتاج إلى إعداد حسابات وخادم وقاعدة بيانات فعلية.</div><div class="card settings-section"><h4>بيانات الصيدلية</h4><form onsubmit="saveSettings(event)"><div class="form-grid">${field('اسم الصيدلية','name',s.name,true)}${field('العنوان','address',s.address)}${field('الهاتف','phone',s.phone)}${field('رقم الترخيص','license',s.license)}${field('البريد المعتمد للتنبيهات','managerEmail',s.managerEmail)}${field('حد المخزون المنخفض','lowStock',s.lowStock,false,'number')}${field('التنبيه قبل الانتهاء (أيام)','expiryDays',s.expiryDays,false,'number')}${field('أقصى خصم للصيدلي (%)','pharmacistDiscount',s.pharmacistDiscount,false,'number')}${field('سعر صرف 1 دولار إلى جنيه سوداني','usdToSdg',s.usdToSdg||1,true,'number')}${field('عدد فروقات الصندوق قبل التنبيه','cashVarianceAlertCount',s.cashVarianceAlertCount||3,true,'number')}${field('الرقم الضريبي (اختياري)','taxNumber',s.taxNumber)}<div class="field"><label>ظهور الرقم الضريبي على الإيصال</label><label class="check-row"><input name="showTax" type="checkbox" ${s.showTax?'checked':''}> إظهار الرقم الضريبي إذا كان محفوظًا</label></div></div><div class="form-actions"><button class="btn primary">حفظ الإعدادات</button></div></form></div><div class="card settings-section"><h4>Google Drive — النسخ الاحتياطي السحابي</h4><p class="footer-note">اربط حساب Google ثم استخدم الأزرار لرفع نسخة احتياطية إلى مساحة التطبيق الخاصة في Drive أو استعادتها. الاستعادة تستبدل بياناتك الحالية؛ نزّل نسخة محلية أولًا.</p><div class="toolbar"><button class="btn" onclick="hakimGoogleConnect()">ربط حساب Google</button><button class="btn primary" onclick="hakimDriveBackup()">نسخ احتياطي إلى Google Drive</button><button class="btn" onclick="hakimDriveRestore()">استعادة من Google Drive</button></div><p id="hakimGoogleStatus" class="footer-note">لم يتم ربط Google بعد. يتطلب إعداد OAuth Client ID واستضافة التطبيق على نطاق مسموح.</p></div><div class="card settings-section"><h4>النسخ الاحتياطي والاستعادة</h4><div class="sync-box"><span style="font-size:22px">💾</span><div><b>حفظ محلي مع نسخة سابقة تلقائية</b><br>عند كل حفظ ناجح، يحتفظ النظام بنسخة محلية سابقة قبل استبدال البيانات الحالية. هذه النسخة على الجهاز نفسه وليست بديلًا عن نسخة خارجية.</div></div><p>حالة التخزين: <b id="storageHealth">جارٍ الفحص عند الطلب</b></p><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="exportBackup()">تنزيل نسخة احتياطية JSON</button><button class="btn" onclick="testStorage()">اختبار الحفظ والقراءة</button><button class="btn" onclick="restoreLocalBackup()">استعادة النسخة المحلية السابقة</button><button class="btn" onclick="$('#restoreFile').click()">استعادة من ملف JSON</button><input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restoreBackup(this.files[0])"></div><p class="footer-note">لا يوجد نسخ تلقائي خارج الجهاز أو إلى Google Drive. احتفظ بملف JSON في مكان آخر بانتظام. التخزين المحلي قد يُحذف عند مسح بيانات المتصفح أو تغيير الجهاز.</p></div><div class="card settings-section"><h4>المستخدمون والصلاحيات</h4><div class="grid two-col"><div><b>المدير</b><p class="footer-note">تحكم كامل بالإعدادات والمخزون والمرتجعات والتقارير. هذه الشاشة التجريبية لا تطبق مصادقة فعلية.</p></div><div><b>الصيدلي</b><p class="footer-note">تُضبط صلاحياته في إصدار الإنتاج مع تحقق على الخادم. إخفاء الأزرار وحده لا يوفر حماية أمنية.</p></div></div></div><div class="card settings-section"><h4>إعدادات شخصية لهذا المستخدم</h4><p class="footer-note">هذه التفضيلات لا تغيّر إعدادات بقية المستخدمين ولا تمنح صلاحيات إضافية.</p><form onsubmit="savePersonalPrefs(event)"><div class="form-grid"><div class="field"><label>طريقة عرض القوائم</label><select name="listView"><option value="comfortable" ${(db.preferences.listView||'comfortable')==='comfortable'?'selected':''}>مريحة</option><option value="compact" ${db.preferences.listView==='compact'?'selected':''}>مضغوطة</option></select></div><div class="field"><label>عدد الصفوف المفضل</label><select name="pageSize"><option value="10" ${String(db.preferences.pageSize||20)==='10'?'selected':''}>10</option><option value="20" ${String(db.preferences.pageSize||20)==='20'?'selected':''}>20</option><option value="50" ${String(db.preferences.pageSize||20)==='50'?'selected':''}>50</option></select></div><div class="field"><label>الصفحة الافتراضية</label><select name="homePage"><option value="dashboard">لوحة التحكم</option><option value="sales" ${db.preferences.homePage==='sales'?'selected':''}>المبيعات</option><option value="inventory" ${db.preferences.homePage==='inventory'?'selected':''}>الأدوية والمخزون</option><option value="reports" ${db.preferences.homePage==='reports'?'selected':''}>التقارير</option></select></div></div><div class="form-actions"><button class="btn primary">حفظ تفضيلاتي</button></div></form></div><div class="card settings-section"><h4>صحة النظام والأداء</h4><div class="grid stats">${stat('حجم البيانات المحلي',fmt((systemHealth().bytes/1024).toFixed(1))+' KB','◈','تقدير تقريبي')}${stat('سجلات الأدوية',fmt(systemHealth().drugs),'▤','')}${stat('فواتير البيع',fmt(systemHealth().sales),'▥','')}${stat('حالة الحفظ',systemHealth().last,'✓','هذا الجهاز فقط')}</div><p class="footer-note">هذه مؤشرات محلية أولية وليست مراقبة خادم مباشرًا. قياس سرعة الخادم والتنبيهات الآلية يحتاجان إلى بيئة استضافة وخدمات مراقبة.</p></div><div class="card settings-section"><h4>سجل النشاط</h4>${table(['الوقت','المستخدم','الإجراء','التفاصيل'],db.audit.slice(0,15).map(a=>row([escapeHtml(new Date(a.date).toLocaleString('ar')),escapeHtml(a.user),escapeHtml(a.action),escapeHtml(a.detail)])))}</div>`}
function savePersonalPrefs(e){e.preventDefault();let f=new FormData(e.target);db.preferences={listView:f.get('listView'),pageSize:Number(f.get('pageSize')||20),homePage:f.get('homePage')||'dashboard'};log('تعديل التفضيلات الشخصية',JSON.stringify(db.preferences));toast('تم حفظ تفضيلات هذا المستخدم');render()}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target),before={...db.settings},after={...db.settings};for(let k of ['name','address','phone','license','managerEmail','taxNumber'])after[k]=f.get(k)||'';for(let k of ['lowStock','expiryDays','pharmacistDiscount','usdToSdg','cashVarianceAlertCount'])after[k]=Number(f.get(k)||0);if(after.usdToSdg<=0){toast('سعر الصرف يجب أن يكون أكبر من صفر');return}after.showTax=f.has('showTax');if(!previewChanges('مراجعة إعدادات الصيدلية',before,after,['name','address','phone','license','managerEmail','taxNumber','lowStock','expiryDays','pharmacistDiscount','usdToSdg','cashVarianceAlertCount','taxNumber']))return;for(let k of ['name','address','phone','license','managerEmail','taxNumber'])db.settings[k]=f.get(k)||'';for(let k of ['lowStock','expiryDays','pharmacistDiscount','usdToSdg','cashVarianceAlertCount'])db.settings[k]=Number(f.get(k)||0);db.settings.showTax=f.has('showTax');$('#brandName').textContent=db.settings.name||'حاكم';log('تعديل الإعدادات','بيانات الصيدلية وحدود التنبيه وسعر الصرف');render();toast('تم حفظ الإعدادات')}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function download(name,content,type='text/plain;charset=utf-8'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}function exportBackup(){download('pharmacy-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('تم تجهيز النسخة الاحتياطية للتنزيل')}
function restoreBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.drugs)||!Array.isArray(v.sales)||!v.settings||!Array.isArray(v.purchases||[])||!Array.isArray(v.audit||[]))throw Error('bad');if(!confirm('ستستبدل الاستعادة البيانات الحالية. سيتم تنزيل نسخة احتياطية من الحالة الحالية أولًا. هل تستمر؟'))return;safeRestoreSnapshot();db=v;['drugs','sales','purchases','suppliers','customers','expenses','returns','adjustments','audit','cart','closings'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.settings={...seed.settings,...db.settings};save();$('#brandName').textContent=db.settings.name||'حاكم';log('استعادة نسخة احتياطية',file.name);go('dashboard');toast('تمت الاستعادة')}catch(e){toast('ملف النسخة غير صالح أو غير مكتمل')}};r.readAsText(file)}
function exportDrugs(){let rows=[['name','generic','barcode','strength','form','manufacturer','price','cost','stock','min','batch','expiry'],...db.drugs.map(d=>['name','generic','barcode','strength','form','manufacturer','price','cost','stock','min','batch','expiry'].map(k=>d[k]??''))];download('pharmacy-drugs.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function importDrugs(file){if(!file)return;let r=new FileReader();r.onload=()=>{let lines=r.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),headers=lines.shift().split(',').map(x=>x.replace(/^"|"$/g,''));let count=0;lines.forEach(line=>{let vals=(line.match(/("(?:[^"]|"")*"|[^,]*)(,|$)/g)||[]).filter(Boolean).map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'));let o={};headers.forEach((h,i)=>o[h]=vals[i]||'');if(!o.name)return;if(o.barcode&&db.drugs.some(d=>d.barcode===o.barcode)){return}db.drugs.push({id:id(),name:o.name,generic:o.generic||'',barcode:o.barcode||'',strength:o.strength||'',form:o.form||'',manufacturer:o.manufacturer||'',price:Number(o.price||0),cost:Number(o.cost||0),stock:Number(o.stock||0),min:Number(o.min||db.settings.lowStock),batch:o.batch||'',expiry:o.expiry||'',controlled:false});count++});log('استيراد أدوية','عدد الأصناف '+count);render();toast('تم استيراد '+count+' صنف؛ الأصناف ذات الباركود المكرر تم تجاوزها')};r.readAsText(file)}
function exportData(key){let data=db[key]||[];let headers=[...new Set(data.flatMap(x=>Object.keys(x)))];download('pharmacy-'+key+'.csv','\ufeff'+[headers.join(','),...data.map(x=>headers.map(h=>'"'+String(typeof x[h]==='object'?JSON.stringify(x[h]):x[h]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),'text/csv;charset=utf-8')}
function exportReport(){let rows=[['التاريخ','رقم الفاتورة','الإجمالي','الخصم','الربح','طريقة الدفع'],...db.sales.map(s=>[s.date,s.no,s.total,s.discount,s.profit,s.method])];download('pharmacy-sales-report.csv','\ufeff'+rows.map(r=>r.join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function render(){ $('#content').innerHTML=renderPage(); }
$('#brandName').textContent=db.settings?.name||'صيدليتي';render();

// Google Drive appDataFolder integration. OAuth client ID is public browser configuration.
const HAKIM_GOOGLE_CLIENT_ID='141751672826-mlefolpae7uu7ak8ka65rhchie3d6oa4.apps.googleusercontent.com';
let hakimDriveToken='',hakimTokenClient=null;
function hakimGoogleStatus(t){const e=document.getElementById('hakimGoogleStatus');if(e)e.textContent=t;}
function hakimGoogleConnect(){if(!window.google?.accounts?.oauth2){hakimGoogleStatus('تعذر تحميل خدمة Google. تحقق من الإنترنت وأعد فتح التطبيق.');toast('خدمة Google غير جاهزة');return}hakimTokenClient=google.accounts.oauth2.initTokenClient({client_id:HAKIM_GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata',callback:(r)=>{if(r.error){hakimGoogleStatus('فشل الربط: '+r.error);return}hakimDriveToken=r.access_token;hakimGoogleStatus('تم ربط حساب Google مؤقتًا لهذه الجلسة. يمكنك الآن النسخ الاحتياطي أو الاستعادة.');toast('تم ربط Google لهذه الجلسة')}});hakimTokenClient.requestAccessToken({prompt:'consent'});}
async function hakimDriveBackup(){if(!hakimDriveToken){toast('اربط حساب Google أولًا');return}try{const name='hakim-pharmacy-backup-'+today()+'.json';const meta={name,parents:['appDataFolder'],mimeType:'application/json'};const body=`--hakim_boundary\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--hakim_boundary\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(db)}\r\n--hakim_boundary--`;const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{Authorization:'Bearer '+hakimDriveToken,'Content-Type':'multipart/related; boundary=hakim_boundary'},body});if(!r.ok)throw Error(await r.text());const v=await r.json();hakimGoogleStatus('نجح رفع النسخة إلى Google Drive: '+v.name);toast('تم رفع النسخة الاحتياطية إلى Google Drive')}catch(e){hakimGoogleStatus('فشل النسخ الاحتياطي. تحقق من إعداد OAuth والنطاق المسموح والاتصال.');toast('تعذر النسخ إلى Google Drive');console.error(e)}}
async function hakimDriveRestore(){if(!hakimDriveToken){toast('اربط حساب Google أولًا');return}try{const r=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&orderBy=modifiedTime%20desc',{headers:{Authorization:'Bearer '+hakimDriveToken}});if(!r.ok)throw Error(await r.text());const data=await r.json();if(!data.files?.length){toast('لا توجد نسخة في Google Drive');return}const chosen=data.files[0];if(!confirm('سيتم استبدال بيانات حاكم الحالية بأحدث نسخة من Google Drive ('+chosen.name+'). هل تريد المتابعة؟'))return;download('hakim-before-drive-restore-'+today()+'.json',JSON.stringify(db,null,2),'application/json');const fr=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(chosen.id)+'?alt=media',{headers:{Authorization:'Bearer '+hakimDriveToken}});if(!fr.ok)throw Error(await fr.text());const v=await fr.json();if(!Array.isArray(v.drugs)||!Array.isArray(v.sales)||!v.settings)throw Error('invalid backup');db=v;['drugs','sales','purchases','suppliers','customers','expenses','returns','adjustments','audit','cart','closings'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.settings={...seed.settings,...(db.settings||{})};save();$('#brandName').textContent=db.settings.name||'حاكم';go('dashboard');hakimGoogleStatus('تمت استعادة النسخة: '+chosen.name);toast('تمت الاستعادة من Google Drive')}catch(e){hakimGoogleStatus('تعذرت الاستعادة؛ تحقق من إعداد OAuth وصحة ملف النسخة.');toast('تعذرت الاستعادة من Google Drive');console.error(e)}}
</script></body></html>
